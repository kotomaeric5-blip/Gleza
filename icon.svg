<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

  <defs>
    <linearGradient id="glezaGradient"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Gleza gradient glow -->
  <rect
    x="35"
    y="35"
    width="442"
    height="442"
    rx="120"
    fill="url(#glezaGradient)"
    opacity="0.35"
    filter="url(#glow)"
  />

  <!-- Main Gleza logo background -->
  <rect
    x="40"
    y="40"
    width="432"
    height="432"
    rx="110"
    fill="url(#glezaGradient)"
  />

  <!-- G -->
  <text
    x="256"
    y="345"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="300"
    font-weight="900"
    fill="white"
  >G</text>

  <!-- Gleza logo curved accent -->
  <path
    d="M 220 395
       Q 256 415 292 395"
    fill="none"
    stroke="white"
    stroke-width="9"
    stroke-linecap="round"
    opacity="0.9"
  />

</svg>